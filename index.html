<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="出退勤打刻">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>出退勤打刻</title>
<style>
:root{
  --bg:#eef2f6; --card:#ffffff; --ink:#0f172a; --sub:#475569; --mute:#94a3b8; --line:#dbe2ea;
  --head:#0f172a; --accent:#2563eb; --in:#15803d; --in-bg:#dcfce7; --out:#c2410c; --out-bg:#ffedd5;
  --done:#64748b; --danger:#dc2626; --warn-bg:#fef3c7; --warn:#92400e;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
input,select,textarea{-webkit-user-select:text;user-select:text;font:inherit}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
[hidden]{display:none !important}

.top{position:sticky;top:0;z-index:10;background:var(--head);color:#fff;display:flex;align-items:center;gap:16px;padding:14px 24px}
.top .brand{font-weight:800;font-size:18px;letter-spacing:.04em}
.top .clock{margin-left:auto;text-align:right;line-height:1.1}
.top #date{font-size:15px;color:#cbd5e1}
.top #time{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.top .admin-btn{background:#1e293b;color:#cbd5e1;border:1px solid #334155;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700}
.save-error{background:var(--danger);color:#fff;font-weight:700;padding:10px 24px;font-size:15px}

main{max-width:1200px;margin:0 auto;padding:24px}
h1{font-size:24px;margin:0 0 16px}
.lead{color:var(--sub);margin:-8px 0 18px;font-size:15px}

/* ホーム: 名前の一覧 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.name-btn{display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:20px;min-height:112px;text-align:left;box-shadow:0 1px 2px rgba(15,23,42,.06)}
.name-btn:active{transform:scale(.98);border-color:var(--accent)}
.name-btn .nm{font-size:26px;font-weight:800;word-break:break-all}
.name-btn .st{font-size:14px;font-weight:700;border-radius:999px;padding:4px 10px;background:#f1f5f9;color:var(--sub)}
.name-btn.st-in{border-color:#86efac}
.name-btn.st-in .st{background:var(--in-bg);color:var(--in)}
.name-btn.st-out .st{background:#e2e8f0;color:var(--done)}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:36px;text-align:center;color:var(--sub);font-size:17px}
.foot-note{margin-top:22px;color:var(--mute);font-size:13px;text-align:center}

/* 本人の画面 */
.bar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.back{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 18px;font-weight:700;font-size:16px}
.pname{font-size:32px;font-weight:800}
.kind{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:#dbeafe;color:#1e40af}
.kind.part{background:#d1fae5;color:#065f46}
.pstatus{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;font-size:18px;font-weight:700;color:var(--sub);margin-bottom:18px}
.punch-row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.punch{border-radius:22px;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;box-shadow:0 6px 16px rgba(15,23,42,.12)}
.punch .big{font-size:56px;font-weight:900;letter-spacing:.1em}
.punch small{font-size:17px;font-weight:700;opacity:.92}
.punch.in{background:var(--in)}
.punch.out{background:var(--out)}
.punch:active{transform:scale(.985)}
.punch:disabled{background:#cbd5e1;color:#475569;box-shadow:none}
.person-foot{margin-top:20px;display:flex;justify-content:center}
.sub-btn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 20px;font-weight:700;font-size:16px}
.note{color:var(--sub);text-align:center;font-size:14px;margin-top:14px}

/* 打刻完了 */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(15,23,42,.55)}
.done-card{background:#fff;border-radius:26px;padding:44px 64px;text-align:center;min-width:min(520px,90vw);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.done-card .mark{width:84px;height:84px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:46px;color:#fff;font-weight:900}
.done-card .who{font-size:26px;font-weight:800}
.done-card .what{font-size:48px;font-weight:900;margin:8px 0;font-variant-numeric:tabular-nums}
.done-card .ok{font-size:18px;color:var(--sub);font-weight:700}

/* 表 */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.period{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.period .label{font-weight:800;font-size:17px;margin:0 6px}
.chip{background:#f1f5f9;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{border-bottom:1px solid #e8edf3;padding:10px 8px;text-align:left}
th{background:#f8fafc;color:var(--sub);font-size:13px;position:sticky;top:0}
td.t{font-variant-numeric:tabular-nums;font-weight:700}
tr.sat td:first-child{color:#2563eb}
tr.sun td:first-child{color:#dc2626}
tr.click{cursor:pointer}
tr.click:active td{background:#eff6ff}
.tag{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;display:inline-block}
.tag.edit{background:#ede9fe;color:#5b21b6}
.tag.miss{background:#fee2e2;color:#b91c1c}
.tag.del{background:#e2e8f0;color:#475569}
.table-wrap{max-height:56vh;overflow:auto;border:1px solid #e8edf3;border-radius:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.btn{border-radius:12px;padding:12px 18px;font-weight:800;font-size:15px;background:#e2e8f0}
.btn.primary{background:var(--accent);color:#fff}
.btn.green{background:#059669;color:#fff}
.btn.danger{background:#fee2e2;color:var(--danger)}
.btn.dark{background:#334155;color:#fff}
.btn:disabled{opacity:.5}
.muted{color:var(--sub);font-size:13px}

/* 管理者 */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-weight:800;font-size:15px}
.tab.on{background:var(--head);color:#fff;border-color:var(--head)}
.admin-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.admin-head h1{margin:0}
.admin-head .btn{margin-left:auto}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px;color:var(--sub)}
.input{border:1px solid #cbd5e1;border-radius:10px;padding:12px;font-size:17px;background:#fff;color:var(--ink);min-height:48px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.red-note{color:var(--danger);font-weight:800;font-size:14px;margin:8px 0 0}
.staff-list{margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.staff-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid #e8edf3}
.staff-item:first-child{border-top:0}
.staff-item .nm{flex:1;font-weight:800;font-size:17px;word-break:break-all}
.mini{background:#f1f5f9;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:700;font-size:14px}
.section{margin-top:22px}
.section h2{font-size:17px;margin:0 0 10px}
.warn{background:var(--warn-bg);color:var(--warn);border:1px solid #fcd34d;border-radius:12px;padding:12px 14px;font-weight:700;font-size:14px;margin-bottom:14px}

/* ダイアログ */
.modal{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.dlg{background:#fff;border-radius:20px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dlg h2{margin:0;padding:18px 22px;font-size:20px;border-bottom:1px solid #e8edf3}
.dlg-body{padding:18px 22px;font-size:16px;line-height:1.6;white-space:normal}
.dlg-body p{margin:0 0 10px}
.dlg-btns{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px 20px;flex-wrap:wrap}
.dlg-btns .btn{min-width:120px;padding:14px 18px;font-size:16px}
.hist{margin-top:12px;background:#f8fafc;border:1px solid #e8edf3;border-radius:10px;padding:10px 12px;font-size:13px;color:var(--sub);max-height:180px;overflow:auto}
.hist div{padding:3px 0;border-bottom:1px dashed #e2e8f0}
.hist div:last-child{border-bottom:0}
.err{color:var(--danger);font-weight:700;font-size:14px;min-height:20px;margin-top:6px}

/* PIN */
.pin-dots{display:flex;gap:12px;justify-content:center;margin:6px 0 16px}
.pin-dots span{width:18px;height:18px;border-radius:50%;border:2px solid #94a3b8}
.pin-dots span.f{background:var(--ink);border-color:var(--ink)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:330px;margin:0 auto}
.pinpad button{background:#f1f5f9;border:1px solid var(--line);border-radius:14px;height:64px;font-size:26px;font-weight:800}
.pinpad button.fn{font-size:16px}
.pinpad button:active{background:#dbeafe}

@media (max-width:820px){
  main{padding:18px}
  .punch{min-height:190px}
  .punch .big{font-size:46px}
  .top{padding:12px 16px}
  .top #time{font-size:28px}
  .top .brand{display:none}
}
</style>
</head>
<body>
<div id="saveError" class="save-error" hidden>⚠️ 保存できませんでした。Safariのプライベートブラウズでは保存できません。ホーム画面のアイコンから開いてください。</div>
<header class="top">
  <div class="brand">出退勤打刻</div>
  <button id="btnAdmin" class="admin-btn" type="button">⚙ 管理者</button>
  <div class="clock"><div id="date"></div><div id="time">--:--:--</div></div>
</header>

<main>
  <!-- ホーム -->
  <section id="home">
    <h1>名前を選んでください</h1>
    <div id="nameGrid" class="grid"></div>
    <p id="homeFoot" class="foot-note"></p>
  </section>

  <!-- 本人の画面 -->
  <section id="person" hidden>
    <div class="bar">
      <button class="back" type="button" data-go="home">← 戻る</button>
      <div class="pname" id="pName"></div>
      <span class="kind" id="pKind"></span>
    </div>
    <div class="pstatus" id="pStatus"></div>
    <div class="punch-row">
      <button id="btnIn" class="punch in" type="button"><span class="big">出勤</span><small id="inSub"></small></button>
      <button id="btnOut" class="punch out" type="button"><span class="big">退勤</span><small id="outSub"></small></button>
    </div>
    <div class="person-foot"><button id="btnMine" class="sub-btn" type="button">📋 自分の打刻を見る・書き出す</button></div>
    <p class="note">打刻の時刻を直したいときは、管理者に依頼してください。</p>
  </section>

  <!-- 自分の打刻 -->
  <section id="mine" hidden>
    <div class="bar">
      <button class="back" type="button" id="mineBack">← 戻る</button>
      <div class="pname" id="mName"></div>
    </div>
    <div class="card">
      <div class="period" id="mPeriod"></div>
      <div class="table-wrap"><table><thead><tr><th>日付</th><th>出勤</th><th>退勤</th><th>備考</th></tr></thead><tbody id="mBody"></tbody></table></div>
      <div class="actions">
        <button id="btnMineExport" class="btn green" type="button">📤 この期間の打刻を書き出す(PC取り込み用)</button>
        <span class="muted">書き出したファイルを、PCの勤怠システムで自分の名前を選んでから取り込みます。</span>
      </div>
    </div>
  </section>

  <!-- 管理者 -->
  <section id="admin" hidden>
    <div class="admin-head">
      <h1>⚙ 管理者</h1>
      <button id="btnAdminExit" class="btn dark" type="button">管理者モードを終了</button>
    </div>
    <div id="adminWarn"></div>
    <div class="tabs" id="tabs">
      <button class="tab on" data-tab="punch" type="button">打刻の確認・修正</button>
      <button class="tab" data-tab="staff" type="button">スタッフ</button>
      <button class="tab" data-tab="export" type="button">書き出し・バックアップ</button>
      <button class="tab" data-tab="settings" type="button">設定</button>
    </div>
    <div id="tabBody" class="card"></div>
  </section>
</main>

<div id="overlay" class="overlay" hidden></div>
<div id="modal" class="modal" hidden></div>
<input type="file" id="restoreFile" accept=".json,application/json" hidden>

<script>
(function () {
  'use strict';
  var KEY = { staff: 'ipunch_staff_v1', days: 'ipunch_days_v1', admin: 'ipunch_admin_v1', meta: 'ipunch_meta_v1' };
  var APP_VERSION = '2';  // 2: 全員分の一括書き出し・打刻の削除
  var PERSON_IDLE_MS = 30000, ADMIN_IDLE_MS = 180000, DONE_MS = 3500;
  var WD = ['日', '月', '火', '水', '木', '金', '土'];
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };

  // ---------- 保存 ----------
  function load(k, def) { try { var v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } }
  function store(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); $('saveError').hidden = true; return true; }
    catch (e) { $('saveError').hidden = false; return false; }
  }
  var staff = load(KEY.staff, []); if (!Array.isArray(staff)) staff = [];
  var days = load(KEY.days, {}); if (!days || typeof days !== 'object' || Array.isArray(days)) days = {};
  var admin = load(KEY.admin, null);
  var meta = load(KEY.meta, {}); if (!meta || typeof meta !== 'object') meta = {};
  var saveStaff = function () { return store(KEY.staff, staff); };
  var saveDays = function () { return store(KEY.days, days); };
  var saveMeta = function () { return store(KEY.meta, meta); };
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* 対応していない環境 */ }

  // ---------- 日付 ----------
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var ymd = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var hm = function (d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  function parseYmd(s) { var a = s.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); }
  function addDays(s, n) { var d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
  function periodOf(s) { var d = parseYmd(s), m = d.getMonth() - (d.getDate() < 16 ? 1 : 0); return { start: ymd(new Date(d.getFullYear(), m, 16)), end: ymd(new Date(d.getFullYear(), m + 1, 15)) }; }
  function shiftPeriod(p, n) { var d = parseYmd(p.start); return periodOf(ymd(new Date(d.getFullYear(), d.getMonth() + n, 16))); }
  function datesIn(p) { var out = []; for (var s = p.start; s <= p.end; s = addDays(s, 1)) out.push(s); return out; }
  function fmtDate(s) { var d = parseYmd(s); return (d.getMonth() + 1) + '/' + d.getDate() + '(' + WD[d.getDay()] + ')'; }
  function fmtPeriod(p) { return p.start.replace(/-/g, '/') + ' 〜 ' + p.end.replace(/-/g, '/'); }
  var today = function () { return ymd(new Date()); };

  // ---------- 打刻データ ----------
  var dk = function (n, d) { return n + '|' + d; };
  var getDay = function (n, d) { return days[dk(n, d)] || null; };
  function ensureDay(n, d) { var k = dk(n, d); if (!days[k]) days[k] = { clockIn: '', clockOut: '', history: [] }; return days[k]; }
  var cleanName = function (s) { return String(s || '').replace(/[\s　]+/g, ''); };
  var staffOf = function (n) { return staff.find(function (s) { return s.name === n; }) || null; };

  // ---------- 画面の切り替え ----------
  var screen = 'home', curName = '', lastActive = Date.now();
  function show(id) {
    ['home', 'person', 'mine', 'admin'].forEach(function (s) { $(s).hidden = s !== id; });
    screen = id; lastActive = Date.now(); window.scrollTo(0, 0);
  }
  function goHome() { closeModal(); hideDone(); curName = ''; adminOn = false; renderHome(); show('home'); }

  // ---------- 時計 ----------
  var lastDate = today();
  function tick() {
    var d = new Date();
    $('date').textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日(' + WD[d.getDay()] + ')';
    $('time').textContent = hm(d) + ':' + pad(d.getSeconds());
    if (ymd(d) !== lastDate) { lastDate = ymd(d); if (screen === 'home') renderHome(); if (screen === 'person') renderPerson(); }
    var idle = Date.now() - lastActive;
    if ((screen === 'person' || screen === 'mine') && idle > PERSON_IDLE_MS) goHome();
    if (screen === 'admin' && idle > ADMIN_IDLE_MS) goHome();
  }
  ['pointerdown', 'keydown', 'input', 'scroll', 'touchstart'].forEach(function (t) {
    document.addEventListener(t, function () { lastActive = Date.now(); }, { capture: true, passive: true });
  });

  // ---------- ホーム ----------
  function statusOf(name, date) {
    var d = getDay(name, date);
    if (!d || (!d.clockIn && !d.clockOut)) return { cls: '', text: '未出勤' };
    if (d.clockIn && !d.clockOut) return { cls: 'st-in', text: '出勤中 ' + d.clockIn + '〜' };
    return { cls: 'st-out', text: '退勤済 ' + (d.clockIn || '--:--') + '〜' + d.clockOut };
  }
  function renderHome() {
    var t = today();
    $('nameGrid').innerHTML = staff.length ? staff.map(function (s) {
      var st = statusOf(s.name, t);
      return '<button type="button" class="name-btn ' + st.cls + '" data-name="' + esc(s.name) + '"><span class="nm">' + esc(s.name) + '</span><span class="st">' + esc(st.text) + '</span></button>';
    }).join('') : '<div class="empty" style="grid-column:1/-1">スタッフが登録されていません。<br>右上の「⚙ 管理者」から登録してください。</div>';
    var standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
    $('homeFoot').textContent = standalone ? 'このiPadの中にだけ保存されます(インターネットには送られません)。'
      : '※ ホーム画面に追加したアイコンから開いてください。Safariのタブで開くと、打刻が別の場所に保存されます。';
  }
  $('nameGrid').addEventListener('click', function (ev) {
    var b = ev.target.closest('.name-btn'); if (!b) return;
    curName = b.dataset.name; renderPerson(); show('person');
  });
  document.addEventListener('click', function (ev) { var b = ev.target.closest('[data-go="home"]'); if (b) goHome(); });

  // ---------- 本人の画面 ----------
  function renderPerson() {
    var s = staffOf(curName); if (!s) return goHome();
    $('pName').textContent = s.name + ' さん';
    $('pKind').textContent = s.kind === 'part' ? 'パート' : '正社員';
    $('pKind').className = 'kind' + (s.kind === 'part' ? ' part' : '');
    var d = getDay(s.name, today()) || {};
    $('pStatus').textContent = '今日(' + fmtDate(today()) + '): 出勤 ' + (d.clockIn || '--:--') + ' / 退勤 ' + (d.clockOut || '--:--');
    $('btnIn').disabled = !!d.clockIn; $('inSub').textContent = d.clockIn ? '打刻済み ' + d.clockIn : 'タップで打刻';
    $('btnOut').disabled = !!d.clockOut; $('outSub').textContent = d.clockOut ? '打刻済み ' + d.clockOut : 'タップで打刻';
  }
  function stamp(name, date, type, now) {
    var d = ensureDay(name, date), t = hm(now);
    if (type === 'in') d.clockIn = t; else d.clockOut = t;
    d.deleted = false;
    d.history = Array.isArray(d.history) ? d.history : [];

  // iPadでは共有シート(「"ファイル"に保存」・AirDropなど)、それ以外はダウンロード

  }
  function askPin(title, sub) {

        '<button type="button" class="fn" data-k="c">クリア</button><button type="button" data-k="0">0</button><button type="button" class="fn" data-k="b">⌫</button></div><div class="err" id="pinErr" style="text-align:center"></div>',

      var rec = ensureDay(name, date);
      rec.history = Array.isArray(rec.history) ? rec.history : [];
      rec.history.push({ at: new Date().toISOString(), kind: 'edit', text: '打刻を削除(出勤 ' + (rec.clockIn || 'なし') + ' / 退勤 ' + (rec.clockOut || 'なし') + ')', reason: why });
      rec.clockIn = ''; rec.clockOut = ''; rec.edited = true; rec.deleted = true;
      saveDays(); renderAdmin();
    });
  }

  // スタッフ
  function renderStaffTab(body) {
    body.innerHTML = '<h2 style="margin:0 0 10px;font-size:17px">スタッフを追加</h2>' +
      '<div class="row"><label class="field" style="flex:1;min-width:220px">名前<input class="input" id="sName" maxlength="30" placeholder="例: 山田太郎"></label>' +
      '<label class="field">区分<select class="input" id="sKind"><option value="full">正社員</option><option value="part">パート</option></select></label>' +
      '<button class="btn primary" id="sAdd" type="button" style="min-height:48px">追加</button></div>' +
      '<p class="red-note">※ 姓と名の間にスペースを入れないでください(例: 山田太郎)。PCの勤怠システムと同じ名前で登録してください。</p><div class="err" id="sErr"></div>' +
      '<div class="section"><h2>登録済み(' + staff.length + '人)<span class="muted" style="font-weight:400"> ・ ホーム画面にこの順で並びます</span></h2>' +
      (staff.length ? '<div class="staff-list">' + staff.map(function (s, i) {
        return '<div class="staff-item" data-i="' + i + '"><span class="nm">' + esc(s.name) + '</span>' +
          '<select class="mini" data-act="kind"><option value="full"' + (s.kind !== 'part' ? ' selected' : '') + '>正社員</option><option value="part"' + (s.kind === 'part' ? ' selected' : '') + '>パート</option></select>' +
          '<button class="mini" type="button" data-act="up"' + (i === 0 ? ' disabled' : '') + '>↑</button><button class="mini" type="button" data-act="down"' + (i === staff.length - 1 ? ' disabled' : '') + '>↓</button>' +
          '<button class="mini" type="button" data-act="del" style="color:var(--danger)">名簿から外す</button></div>';
      }).join('') + '</div>' : '<p class="muted">まだ登録されていません。</p>') + '</div>';
    var add = function () {
      var n = cleanName($('sName').value);
      if (!n) { $('sErr').textContent = '名前を入力してください。'; return; }
      if (staffOf(n)) { $('sErr').textContent = '「' + n + '」は、すでに登録されています。'; return; }
      staff.push({ name: n, kind: $('sKind').value === 'part' ? 'part' : 'full' }); saveStaff(); renderAdmin();
    };
    $('sAdd').onclick = add;
    $('sName').onkeydown = function (ev) { if (ev.key === 'Enter' && !ev.isComposing) add(); };
    var list = body.querySelector('.staff-list'); if (!list) return;
    list.addEventListener('change', function (ev) {
      var it = ev.target.closest('.staff-item'); if (!it || ev.target.dataset.act !== 'kind') return;
      staff[+it.dataset.i].kind = ev.target.value === 'part' ? 'part' : 'full'; saveStaff();
    });
    list.addEventListener('click', function (ev) {
      var b = ev.target.closest('button[data-act]'); if (!b) return; var i = +b.closest('.staff-item').dataset.i, a = b.dataset.act;
      if (a === 'up' && i > 0) { staff.splice(i - 1, 0, staff.splice(i, 1)[0]); saveStaff(); renderAdmin(); }
      if (a === 'down' && i < staff.length - 1) { staff.splice(i + 1, 0, staff.splice(i, 1)[0]); saveStaff(); renderAdmin(); }
      if (a === 'del') confirmBox('名簿から外す', staff[i].name + ' さんを、名前の一覧から外します。\nこれまでの打刻は消えません(もう一度同じ名前で追加すれば表示されます)。', '外す', true)
        .then(function (ok) { if (ok) { staff.splice(i, 1); saveStaff(); renderAdmin(); } });
    });
  }

  // 書き出し・バックアップ
  function renderExportTab(body) {
    var cur = periodOf(today()), prev = shiftPeriod(cur, -1);
    body.innerHTML = '<h2 style="margin:0 0 10px;font-size:17px">全員分をまとめて書き出す(PCの一括取り込み用)</h2>' +
      (staff.length ? '<div class="row"><label class="field">期間<select class="input" id="aPeriod"><option value="prev">前の締め期間 ' + fmtPeriod(prev) + '</option><option value="cur">今の期間 ' + fmtPeriod(cur) + '</option></select></label>' +
        '<button class="btn primary" id="aGo" type="button" style="min-height:48px">📤 全員分を書き出す</button></div>' +
        '<p class="muted">1つのファイルを各PCで取り込むと、そのPCの名簿にいる人の分だけが反映されます。</p>' : '') +
      '<div class="section"><h2>スタッフごとに書き出す</h2>' +
      (staff.length ? '<div class="row"><label class="field">スタッフ' + staffSelect('xStaff', admStaff || staff[0].name) + '</label>' +
        '<label class="field">期間<select class="input" id="xPeriod"><option value="prev">前の締め期間 ' + fmtPeriod(prev) + '</option><option value="cur">今の期間 ' + fmtPeriod(cur) + '</option></select></label>' +
        '<button class="btn green" id="xGo" type="button" style="min-height:48px">📤 書き出す</button></div>' +
        '<p class="muted">本人の画面の「📋 自分の打刻を見る・書き出す」からも、同じファイルを書き出せます。</p>' : '<p class="muted">スタッフが登録されていません。</p>') + '</div>' +
      '<div class="section"><h2>バックアップ(全員分・設定を含む)</h2>' +
      '<p class="muted">最後のバックアップ: ' + (meta.lastBackup ? esc(new Date(meta.lastBackup).toLocaleString('ja-JP')) : 'なし') + '</p>' +
      '<div class="actions"><button class="btn dark" id="bSave" type="button">💾 バックアップを保存</button><button class="btn" id="bLoad" type="button">📂 バックアップから復元</button></div>' +
      '<p class="muted">復元すると、このiPadの打刻・スタッフ・管理者PINが、バックアップの内容に置き換わります。</p></div>';
    if (staff.length) {
      $('xGo').onclick = function () { exportStaff($('xStaff').value, $('xPeriod').value === 'prev' ? prev : cur); };
      $('aGo').onclick = function () { exportAll($('aPeriod').value === 'prev' ? prev : cur); };
    }
    $('bSave').onclick = function () {
      var data = { format: 'ipad-punch-backup', version: 1, exportedAt: new Date().toISOString(), staff: staff, days: days, admin: admin };
      var d = new Date(), fn = '打刻バックアップ_' + ymd(d) + '_' + pad(d.getHours()) + pad(d.getMinutes()) + '.json';
      deliver(fn, JSON.stringify(data)).then(function (how) { if (how === 'cancel') return; meta.lastBackup = new Date().toISOString(); saveMeta(); renderAdmin(); });
    };
    $('bLoad').onclick = function () { $('restoreFile').click(); };
  }
  $('restoreFile').addEventListener('change', function () {
    var f = this.files && this.files[0]; this.value = ''; if (!f) return;
    var fr = new FileReader();
    fr.onload = function () {
      var o; try { o = JSON.parse(String(fr.result).replace(/^﻿/, '')); } catch (e) { o = null; }
      if (!o || o.format !== 'ipad-punch-backup' || !Array.isArray(o.staff) || !o.days || typeof o.days !== 'object') return alertBox('復元できません', 'このiPad打刻アプリのバックアップファイルではありません。');
      var n = Object.keys(o.days).length;
      confirmBox('バックアップから復元', '保存日時: ' + (o.exportedAt ? new Date(o.exportedAt).toLocaleString('ja-JP') : '不明') + '\nスタッフ ' + o.staff.length + '人 / 打刻 ' + n + '日分\n\nこのiPadの今のデータは、この内容に置き換わります。復元しますか?', '復元する', true).then(function (ok) {
        if (!ok) return;
        staff = o.staff.filter(function (s) { return s && s.name; }).map(function (s) { return { name: cleanName(s.name), kind: s.kind === 'part' ? 'part' : 'full' }; });
        days = o.days; if (o.admin && o.admin.hash) admin = o.admin;
        saveStaff(); saveDays(); store(KEY.admin, admin);
        alertBox('復元しました', 'バックアップの内容に戻しました。').then(function () { openAdmin('punch'); });
      });
    };
    fr.readAsText(f);
  });

  // 設定
  function renderSettingsTab(body) {
    var standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
    var sw = 'serviceWorker' in navigator && navigator.serviceWorker.controller;
    body.innerHTML = '<h2 style="margin:0 0 10px;font-size:17px">管理者PIN</h2><button class="btn primary" id="pChange" type="button">管理者PINを変更</button>' +
      '<div class="section"><h2>動作の状態</h2><table><tbody>' +
      '<tr><td>ホーム画面のアイコンから起動</td><td>' + (standalone ? '✅ はい' : '⚠️ いいえ(Safariのタブで開いています)') + '</td></tr>' +
      '<tr><td>オフラインで起動できる</td><td>' + (sw ? '✅ はい' : '⚠️ まだ準備できていません(一度ネットにつないだ状態で開いてください)') + '</td></tr>' +
      '<tr><td>アプリのバージョン</td><td>' + APP_VERSION + '(全員分の書き出し・打刻の削除に対応)</td></tr>' +
      '<tr><td>登録スタッフ / 打刻のある日</td><td>' + staff.length + '人 / ' + Object.keys(days).length + '日分</td></tr>' +
      '</tbody></table></div>' +
      '<div class="section"><h2>自動で戻る時間</h2><p class="muted">本人の画面は30秒、管理者画面は3分、操作がないと最初の画面に戻ります。</p></div>';
    $('pChange').onclick = function () {
      askPin('新しい管理者PIN', '新しい暗証番号(4〜8桁)を入力してください').then(function (p1) {
        if (!p1) return;
        askPin('もう一度入力', '確認のため、同じ暗証番号を入力してください').then(function (p2) {
          if (p2 == null) return;
          if (p1 !== p2) return alertBox('一致しません', '暗証番号が一致しませんでした。変更していません。');
          var salt = Math.random().toString(36).slice(2); admin = { salt: salt, hash: hashPin(p1, salt) }; store(KEY.admin, admin);
          alertBox('変更しました', '管理者PINを変更しました。');
        });
      });
    };
  }

  // ---------- 起動 ----------
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('sw.js').catch(function () { /* オフライン対応なしで動かす */ });
  }
  renderHome(); tick(); setInterval(tick, 1000);
  setInterval(function () { if (screen === 'home' && $('modal').hidden) renderHome(); }, 30000);
})();
</script>
</body>
</html>
